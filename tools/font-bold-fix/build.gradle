plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '1.0.0'
group = 'dev.sunlit.fontfix'
base { archivesName = 'sunlit-font-bold-fix' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
 mappings channel: 'official', version: '1.20.1'
 runs {
  client {
   workingDirectory project.file('run')
   args '--mixin', 'sunlit_font_bold_fix.mixins.json'
   mods { sunlit_font_bold_fix { source sourceSets.main } }
  }
 }
}
repositories { maven { url = 'https://maven.minecraftforge.net' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
jar {
 manifest.attributes('MixinConfigs': 'sunlit_font_bold_fix.mixins.json')
 finalizedBy 'reobfJar'
}
