allprojects {
 afterEvaluate { project ->
  sourceSets { petVisual {
   java.srcDir new File(rootDir,'tools/visual-preview')
   java.include 'PetVisualCheck.java'
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }}
  minecraft.runs.client.mods.sunlit_journal_core.source sourceSets.petVisual
  minecraft.runs.client.property 'sunlit.petVisualCheck','true'
  minecraft.runs.client.property 'sunlit.previewOutput',new File(rootDir,'validation/pets-0.9.0').absolutePath
  minecraft.runs.client.args '--width','1280','--height','900'
 }
}
