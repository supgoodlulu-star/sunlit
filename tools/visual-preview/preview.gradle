allprojects {
    afterEvaluate { project ->
        sourceSets {
            visualPreview {
                java.srcDir new File(rootDir, 'tools/visual-preview')
                java.include 'JournalVisualPreview.java'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client.mods.sunlit_journal_core.source sourceSets.visualPreview
        minecraft.runs.client.property 'sunlit.visualPreview', 'true'
        minecraft.runs.client.property 'sunlit.previewOutput', new File(rootDir, 'validation').absolutePath
        minecraft.runs.client.args '--width', '1280', '--height', '900'
    }
}
