allprojects {
 afterEvaluate { project ->
  sourceSets { petReconnect {
   java.srcDirs new File(rootDir,'tools/visual-preview'),new File(rootDir,'tools/reward-fixtures')
   java.include 'PetReconnectCheck.java','RewardFixtureItems.java'
   resources.srcDir new File(rootDir,'tools/reward-fixtures/resources')
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }}
  minecraft.runs.client.mods.sunlit_journal_core.source sourceSets.petReconnect
  minecraft.runs.client.property 'sunlit.petReconnectCheck','true'
  minecraft.runs.client.property 'sunlit.rewardFixtures','true'
  minecraft.runs.client.property 'sunlit.reconnectPhase',providers.gradleProperty('reconnectPhase').getOrElse('0')
  minecraft.runs.client.args '--width','1280','--height','900','--quickPlaySingleplayer','SunlitInputTest'
 }
}
