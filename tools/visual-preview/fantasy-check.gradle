allprojects {
    afterEvaluate { project ->
        sourceSets {
            fantasyCheck {
                java.srcDir new File(rootDir, 'tools/visual-preview')
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        minecraft.runs.client.mods.sunlit_journal_core.source sourceSets.fantasyCheck
        minecraft.runs.client.property 'sunlit.fantasyCheck', 'true'
        minecraft.runs.client.property 'sunlit.previewOutput', new File(rootDir, 'validation').absolutePath
        minecraft.runs.client.args '--width', '1440', '--height', '960', '--quickPlaySingleplayer', 'SunlitCitadelTest'
    }
}
