allprojects {
 afterEvaluate { project ->
  sourceSets { foxPreview {
   java.srcDir new File(rootDir,'tools/visual-preview')
   java.include 'FoxModelPreview.java'
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
  }}
  minecraft.runs.client.mods.sunlit_journal_core.source sourceSets.foxPreview
  minecraft.runs.client.property 'sunlit.foxModelPreview','true'
  minecraft.runs.client.property 'sunlit.previewOutput',new File(rootDir,'validation/pets-0.9.2').absolutePath
  minecraft.runs.client.args '--width','1600','--height','1000'
 }
}
