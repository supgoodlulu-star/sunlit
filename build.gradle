plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '0.8.2-journal'
group = 'dev.sunlit.journal'
base { archivesName = 'sunlit-journal-core' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { sunlit_journal_core { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { sunlit_journal_core { source sourceSets.main } } }
    }
}
repositories { maven { url = 'https://maven.minecraftforge.net' } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar.finalizedBy('reobfJar')

sourceSets.test.java.srcDir "tools/reward-fixtures"
sourceSets.test.resources.srcDir "tools/reward-fixtures/resources"

minecraft.runs {
    gameTestServer {
        workingDirectory project.file('run-gametest')
        property 'forge.enabledGameTestNamespaces', 'sunlit_journal_core'
        property 'sunlit.rewardFixtures', 'true'
        property 'forge.logging.console.level', 'info'
        mods { sunlit_journal_core { source sourceSets.main; source sourceSets.test } }
    }
}

// Optional user-provided mods, remapped by ForgeGradle for development only.
// Normal source builds need no third-party mod JARs because integrations are isolated.
if (providers.gradleProperty('integrationMods').getOrElse('false').toBoolean()) {
    def modDirectory = providers.gradleProperty('integrationModDir').getOrElse('provided-mods')
    repositories { flatDir { dirs modDirectory } }
    dependencies {
        runtimeOnly fg.deobf('sunlit.local:servernick:1.2.0')
        runtimeOnly fg.deobf('sunlit.local:puffish_skills:0.16.1-1.20-forge')
        runtimeOnly fg.deobf('sunlit.local:Patchouli:1.20.1-85-FORGE')
    }
    minecraft.runs.gameTestServer.property 'sunlit.integrationTests', 'true'
    minecraft.runs.all {
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
    }
    tasks.matching { it.name in ['runGameTestServer', 'runClient', 'runServer'] }.configureEach {
        dependsOn 'createSrgToMcp'
    }
}

// Journal-only distribution: no vanilla item overrides or cosmetic models/textures.
tasks.named('processResources') {
    exclude 'assets/minecraft/**'
    exclude 'assets/sunlit_journal_core/models/fantasy/**'
    exclude 'assets/sunlit_journal_core/models/item/fantasy/**'
    exclude 'assets/sunlit_journal_core/models/item/cloud_pickaxe.json'
    exclude 'assets/sunlit_journal_core/models/item/starlight_sword.json'
    exclude 'assets/sunlit_journal_core/textures/item/cloud_pickaxe.png'
    exclude 'assets/sunlit_journal_core/textures/item/starlight_sword.png'
    exclude 'assets/sunlit_journal_core/textures/item/celestial_palette.png'
    exclude 'assets/sunlit_journal_core/textures/item/fantasy_materials/**'
    exclude { e -> e.path.startsWith('assets/sunlit_journal_core/textures/item/fantasy_') && !e.name.startsWith('fantasy_ticket') }
    // Retain old item IDs and their basic icons only.
    includeEmptyDirs = false
}
